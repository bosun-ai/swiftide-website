[package]
name = "swiftide-docs-snippets"
description = "Rust excerpts shown on swiftide.rs. Every snippet compiles against the pinned swiftide."
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

# Standalone: not part of the vendored swiftide workspace.
[workspace]

[dependencies]
# Heavy native integrations (lancedb, duckdb, fastembed, kafka, fluvio, aws-bedrock) are only
# shown from `vendor/swiftide/examples`, which swiftide's own CI compiles.
swiftide = { path = "../vendor/swiftide/swiftide", features = [
  "openai",
  "anthropic",
  "ollama",
  "qdrant",
  "redis",
  "pgvector",
  "tree-sitter",
  "mcp",
  "swiftide-agents",
  "json-schema",
  "metrics",
  "tiktoken",
] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# `StreamExt::next` on `ChatCompletionStream` (models/overview); swiftide does not re-export it.
futures-util = "0.3"
# `#[async_trait]` for the trait implementations on reference/upgrading.
async-trait = "0.1"
# Only for `OpenAIConfig` and `Client::with_config` on models/overview; swiftide does not re-export it.
async-openai = { version = "0.41", default-features = false }
# `Prompt::extend` takes a `tera::Tera`; swiftide does not re-export tera.
tera = { version = "1.20", default-features = false }
# `rustls::crypto::ring::default_provider` on reference/feature-flags; swiftide selects no crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Snippets are read by people; a warning in one is a bug on the site.
[lints.rust]
warnings = "deny"
