name: Site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  snippets:
    name: Snippets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Rust (snippets/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: snippets
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snippets
      - name: cargo check
        run: cargo check --locked --all-targets
        working-directory: snippets

  site:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Tags are needed: the site derives the swiftide version from `git describe --tags`.
          fetch-depth: 0
          filter: blob:none
      - name: Fetch swiftide tags
        run: git -C vendor/swiftide fetch --tags --quiet
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint:idents
      - run: pnpm astro check
      - run: pnpm build
      - run: pnpm verify:dist
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          path: ./dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: [snippets, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
